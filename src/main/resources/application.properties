spring.application.name=PetCare
server.port=8080

# Base de datos (MySQL)
# Los valores después de ":" son los de desarrollo; en otro entorno se pisan con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/PetCare?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
# Clave en Base64 (mínimo 256 bits). En producción se pisa con la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:UGV0Q2FyZS1jbGF2ZS1zZWNyZXRhLWRlLWRlc2Fycm9sbG8tY2FtYmlhbGEtZW4tcHJvZA==}
# Duración del token: 8 horas
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
