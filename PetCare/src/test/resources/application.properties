# Configuración para los tests: base H2 en memoria (modo MySQL), se crea y se borra en cada corrida.
spring.datasource.url=jdbc:h2:mem:petcare;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=VGVzdC1jbGF2ZS1zZWNyZXRhLXBhcmEtbG9zLXRlc3RzLWRlLVBldENhcmUtMTIzNDU2
jwt.expiration-ms=3600000
