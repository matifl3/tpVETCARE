@if (loading()) {
  <div class="dashboard"><p>Cargando...</p></div>
} @else {
  <div class="dashboard">
    <div class="encabezado-pagina">
      <h1>Mis Mascotas</h1>
      <button type="button" class="btn-primary" (click)="toggleForm()">
        {{ mostrarForm() ? 'Cancelar' : '+ Nueva Mascota' }}
      </button>
    </div>

    <app-mensaje-alerta [mensaje]="error()" />

    @if (mostrarForm()) {
      <app-mascota-form
        [mascotaEditar]="mascotaEditar()"
        [guardando]="guardando()"
        (guardar)="onGuardar($event)"
      />
    } @else if (mascotas().length === 0) {
      <p class="texto-gris">No tenés mascotas registradas. ¡Agregá una!</p>
    } @else {
      <div class="card-grid">
        @for (m of mascotas(); track m.idMascota) {
          <app-mascota-card
            [mascota]="m"
            (editar)="handleEditar($event)"
            (eliminar)="handleEliminar($event)"
          />
        }
      </div>
    }

    <a routerLink="/dashboard" class="btn-secondary link-volver">← Volver al Dashboard</a>
  </div>
}

@if (confirmacion(); as conf) {
  <app-confirmar-modal
    [titulo]="conf.titulo"
    [mensaje]="conf.mensaje"
    [textoConfirmar]="conf.textoConfirmar ?? 'Confirmar'"
    (confirmar)="ejecutarConfirmacion()"
    (cancelar)="confirmacion.set(null)"
  />
}
