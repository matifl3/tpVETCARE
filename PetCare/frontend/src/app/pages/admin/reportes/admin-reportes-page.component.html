<div class="dashboard">
  <div class="admin-header">
    <h1>Reportes</h1>
    <a routerLink="/dashboard" class="btn-secondary btn-volver">← Volver al Dashboard</a>
  </div>

  <div class="admin-card mb-24">
    <div class="tabs-reporte">
      <button
        type="button"
        class="tab-btn"
        [class.active]="tipo() === 'ganancias'"
        (click)="tipo.set('ganancias')"
      >
        Ganancias
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="tipo() === 'ventas'"
        (click)="tipo.set('ventas')"
      >
        Ventas
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="tipo() === 'productos'"
        (click)="tipo.set('productos')"
      >
        Productos más vendidos
      </button>
    </div>
  </div>

  @switch (tipo()) {
    @case ('ganancias') {
      <app-reporte-ganancias />
    }
    @case ('ventas') {
      <app-reporte-ventas />
    }
    @case ('productos') {
      <app-reporte-productos />
    }
  }
</div>
